<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault-Tec XP Terminal</title>
    <style>
        :root { 
            --f76-yellow: #f2c224; 
            --f76-panel: rgba(20, 25, 20, 0.85); 
        }

        body { 
            font-family: 'Courier New', Courier, monospace; 
            background: url('sfondo.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: var(--f76-yellow); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* EFFETTO SFARFALLIO CRT */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 2;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .pip-boy { 
            position: relative;
            z-index: 3;
            width: 90%;
            max-width: 500px; 
            border: 3px solid var(--f76-yellow); 
            padding: 30px; 
            border-radius: 15px; 
            background: var(--f76-panel); 
            box-shadow: 0 0 20px rgba(242, 194, 36, 0.3);
            backdrop-filter: blur(8px);
        }

        h1 { text-align: center; border-bottom: 2px solid var(--f76-yellow); padding-bottom: 10px; text-transform: uppercase; }
        .form-group { margin-bottom: 15px; }
        input, select { 
            width: 100%; padding: 10px; background: #000; 
            border: 1px solid var(--f76-yellow); color: var(--f76-yellow); 
            box-sizing: border-box; font-family: inherit;
        }
        .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .checkbox-item { font-size: 0.8em; border: 1px solid #444; padding: 5px; display: flex; align-items: center; }
        button { 
            width: 100%; padding: 15px; background: var(--f76-yellow); 
            color: #000; border: none; font-weight: bold; cursor: pointer; 
            font-size: 1.1em; transition: 0.3s;
        }
        button:hover { background: #fff; box-shadow: 0 0 15px #fff; }
        #result-box { margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.5); border: 1px dashed var(--f76-yellow); text-align: center; }
        .xp-val { font-size: 2.2em; display: block; color: #fff; text-shadow: 0 0 10px var(--f76-yellow); }
    </style>
</head>
<body>

<div class="pip-boy">
    <h1>XP CALCULATOR v3.0</h1>
    <div class="form-group">
        <label>XP BASE NEMICO:</label>
        <input type="number" id="baseXp" value="160">
    </div>
    <div class="form-group">
        <label>INTELLIGENZA (INT):</label>
        <input type="number" id="intStat" value="15">
    </div>
    <div class="form-group">
        <label>MUTAZIONE:</label>
        <select id="mutation" onchange="updateFoodOptions()">
            <option value="none">Nessuna</option>
            <option value="herbivore">Erbivoro (Piante x2)</option>
            <option value="carnivore">Carnivoro (Carne x2)</option>
        </select>
    </div>
    <div class="checkbox-grid" id="food-options"></div>
    <div class="checkbox-grid">
        <div class="checkbox-item"><input type="checkbox" id="sin"><label>Squadra Strana</label></div>
        <div class="checkbox-item"><input type="checkbox" id="inspirational"><label>Ispirazione</label></div>
        <div class="checkbox-item"><input type="checkbox" id="lunchboxes"><label>4 Cestini</label></div>
        <div class="checkbox-item"><input type="checkbox" id="leader"><label>Statuina Leader</label></div>
    </div>
    <button onclick="calculate()">ESEGUI CALCOLO</button>
    <div id="result-box">TOTALE STIMATO:<span class="xp-val" id="totalXp">0 XP</span></div>
</div>

<script>
    const foodData = {
        herbivore: [{name: "Relish Mirtilli", bonus: 0.10}, {name: "Bombe Cervello (INT)", isInt: true, val: 3}],
        carnivore: [{name: "Stufato Scoiattolo", bonus: 0.10}, {name: "Cervello Scorch. (INT)", isInt: true, val: 3}],
        none: [{name: "Zuppa Mirtilli", bonus: 0.05}]
    };

    function updateFoodOptions() {
        const mut = document.getElementById('mutation').value;
        const container = document.getElementById('food-options');
        container.innerHTML = foodData[mut].map(f => `
            <div class="checkbox-item">
                <input type="checkbox" class="food-check" data-bonus="${f.bonus || 0}" data-isint="${f.isInt || false}" data-intval="${f.val || 0}">
                <label>${f.name}</label>
            </div>`).join('');
    }

    function calculate() {
        let baseXp = parseFloat(document.getElementById('baseXp').value) || 0;
        let intell = parseFloat(document.getElementById('intStat').value) || 0;
        let mut = document.getElementById('mutation').value;
        let sin = document.getElementById('sin').checked;
        let bonusPerc = 0; let extraInt = 0;

        document.querySelectorAll('.food-check').forEach(f => {
            if(f.checked) {
                let mult = (mut !== 'none') ? (sin ? 2.5 : 2) : 1;
                if(f.dataset.isint === "true") extraInt += f.dataset.intval * mult;
                else bonusPerc += f.dataset.bonus * mult;
            }
        });

        if(document.getElementById('inspirational').checked) bonusPerc += 0.15;
        if(document.getElementById('lunchboxes').checked) bonusPerc += 1.0;
        if(document.getElementById('leader').checked) bonusPerc += 0.05;

        let finalXp = baseXp * (1 + ((intell + extraInt) * 0.03)) * (1 + bonusPerc);
        document.getElementById('totalXp').innerText = Math.round(finalXp) + " XP";
    }
    updateFoodOptions();
</script>
</body>
</html>
